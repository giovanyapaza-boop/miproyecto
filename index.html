<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda de Herramientas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header class="header">
        <div class="menu container">
            <a href="#" class="logo">logo</a>
            <input type="checkbox" id="menu" />
            <label for="menu">
                <img src="imagenes/menu.png" class="menu-icono" alt="menu">
            </label>
            <nav class="navbar">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Catalogo</a></li>
                    <li><a href="#">Nosotros</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>
        </div>

        <div class="header-content container">
            <div class="header-img">
                <img src="imagenes/img1.png" alt="">
            </div>
            <div class="header-txt">
                <h1>Ofertas especiales</h1>
                <p>adquiere las mejores herramientas</p>
            </div>
            <a href="#" class="btn-1">informacion</a>
        </div>
    </header>

    <main>
        <button id="btn-tema" aria-label="Activar modo oscuro" title="Cambiar tema"><i class="fa-solid fa-moon"></i></button>
        <section>
            <h2>Bienvenido</h2>
            <p>A la tienda de herramientas Electricas y Manuales Gikar</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Giovany Apaza. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
